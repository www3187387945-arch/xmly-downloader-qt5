name: Build Windows EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt + MinGW toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          set-env: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $mingwBin = "${{ env.IQTA_TOOLS }}\mingw810_64\bin"
          echo "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build cgo static library
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          cd src/cgoqt
          go build -buildmode=c-archive -o xmlydownloader.a

      - name: Build with qmake
        shell: pwsh
        run: |
          mkdir build
          cd build
          qmake CONFIG+=release ../src/xmly-downloader-qt5.pro
          mingw32-make -j2

      - name: Bundle Qt DLLs
        shell: pwsh
        run: |
          cd build/release
          windeployqt xmly-downloader-qt5.exe

      - name: Package into zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/release/* -DestinationPath xmly-downloader-qt5_win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmly-downloader-qt5_win64
          path: xmly-downloader-qt5_win64.zip
